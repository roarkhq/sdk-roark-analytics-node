name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  review:
    if: |
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      !startsWith(github.head_ref, 'release-please--') &&
      github.head_ref != 'next'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # The review must be able to compare generated code with the complete
          # Stainless-authored history, not only with the current PR snapshot.
          fetch-depth: 0

      - name: PR Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Codegen and release PRs are opened by the Stainless app, which the
          # action otherwise rejects as a non-human actor.
          allowed_bots: 'stainless-app'
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform a comprehensive code review. The repository is replacing
            Stainless as the generator for our SDKs, CLI, and MCP server. The
            primary merge gate is behavioral and structural parity with the
            established Stainless-generated output. A change that is reasonable
            in isolation but drifts from that baseline is a bug unless the PR
            explicitly documents and justifies the divergence.

            1. **Stainless parity (highest priority; merge-blocking)**
               - Inspect the full git history and identify prior
                 Stainless-generated commits using commit authors, messages,
                 generated-file headers, and surrounding history. Do not assume
                 that the latest commit is a sufficient baseline.
               - Compare the PR with both its base branch and the closest
                 equivalent Stainless-generated implementations.
               - Verify that generated SDK, CLI, and MCP code preserves the
                 existing file layout, module boundaries, naming conventions,
                 public APIs, types, method signatures, overloads, defaults,
                 pagination, error behavior, retries, serialization, and
                 request/response handling.
               - Check generated tests, fixtures, snapshots, examples, and
                 documentation against historical Stainless patterns. Flag
                 missing coverage and tests weakened or changed merely to make
                 new output pass.
               - Look for nondeterministic output, unnecessary formatting or
                 ordering churn, unrelated rewrites, duplicated declarations,
                 accidental deletions, and changes that would make repeated
                 generation drift.
               - For CLI changes, compare command names, flags, help text,
                 defaults, exit behavior, and compatibility with the historical
                 CLI structure.
               - For MCP changes, compare tool names, schemas, descriptions,
                 required fields, returned content, and tool coverage with the
                 historical MCP surface and snapshots.
               - Distinguish intentional, PR-documented migrations from
                 accidental drift. Every accepted divergence must have a clear
                 reason and focused regression coverage.
               - Treat unexplained parity failures, public API drift, missing
                 generated resources, and incompatible CLI/MCP surface changes
                 as blocking findings.

            2. **Code Quality**
               - Clean code principles and best practices
               - Proper error handling and edge cases
               - Code readability and maintainability

            3. **Security**
               - Check for potential security vulnerabilities
               - Validate input sanitization
               - Review authentication/authorization logic

            4. **Performance**
               - Identify potential performance bottlenecks
               - Review database queries for efficiency
               - Check for memory leaks or resource issues

            5. **Testing**
               - Verify adequate test coverage
               - Review test quality and edge cases
               - Check for missing test scenarios

            6. **Documentation**
               - Ensure code is properly documented
               - Verify README updates for new features
               - Check API documentation accuracy

            Provide detailed feedback using inline comments for specific issues.

            After reviewing, post a top-level summary comment on the PR with the following format:

            ## Code Review Summary

            | Category | Score | Notes |
            |----------|-------|-------|
            | Stainless Parity | X/5 | Brief note |
            | Code Quality | X/5 | Brief note |
            | Security | X/5 | Brief note |
            | Performance | X/5 | Brief note |
            | Testing | X/5 | Brief note |
            | Documentation | X/5 | Brief note |
            | **Overall** | **X/5** | |

            Scoring guide:
            - 0: Critical issues, must fix before merge
            - 1: Major issues that should be addressed
            - 2: Several concerns worth discussing
            - 3: Acceptable with minor suggestions
            - 4: Good quality with nitpicks only
            - 5: Excellent, no issues found

            The overall score cannot exceed the Stainless Parity score. Follow
            the score table with:
            - the historical Stainless commits/files used as baselines;
            - parity differences classified as preserved, intentional, or
              unexplained;
            - blocking findings and missing regression tests;
            - a brief list of other key findings.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*)"

  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
