# Publishes @roarkanalytics/cli, and nothing else.
#
# Separate from `publish-npm.yml` on purpose. That workflow belongs to the vendor
# release train: it fires on a GitHub release, and publishes the SDK and the MCP
# server at whatever version release-please just cut. The CLI does not ship on
# that train - its versions are its own, a renamed command is breaking for it and
# invisible to the SDK - and putting it there would mean every CLI release
# republishes two packages that did not change.
#
# So this is manual and single-purpose: pick a ref, rehearse it, publish it. The
# vendor's workflow is untouched and keeps publishing exactly what it publishes
# today.
name: Publish CLI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and check, but do not publish'
        type: boolean
        default: true
      tag:
        description: 'npm dist-tag to publish under'
        type: string
        default: 'latest'

concurrency:
  group: publish-cli
  cancel-in-progress: false

# The publish authenticates to npm with NODE_AUTH_TOKEN, not with the GitHub
# token, so read is all this needs: check out the ref, build it, push the tarball
# to a registry that is not GitHub. Unlike `publish-npm.yml`, nothing here
# uploads a release asset.
permissions:
  contents: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      # Whichever branch or tag the run was dispatched from. Note `main` is far
      # behind `next` in this repository, so a release is normally dispatched
      # from `next`.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '10.30.1'

      - run: pnpm install --frozen-lockfile

      # The root build also builds every package under packages/, and the CLI
      # cannot be built without it: `@roarkanalytics/sdk` is a `workspace:*`
      # dependency that resolves through the root package's dist.
      - name: Build
        run: pnpm build

      # A publish is immutable, so the suite runs here as well as in ci-cli.yml:
      # this workflow can be dispatched from any ref, including one that never
      # went through a pull request.
      - name: Test
        run: pnpm --filter @roarkanalytics/cli test

      # `dist/` is what gets published, so every check below reads from there
      # rather than from the source package.json. The two differ: the build
      # rewrites the bin path and replaces the `workspace:*` dependency with the
      # version of the SDK this CLI was built against.
      - name: Check what is about to be published
        id: check
        working-directory: packages/cli/dist
        run: |
          set -euo pipefail

          version=$(jq -r -e '.version' package.json)
          sdk_range=$(jq -r -e '.dependencies["@roarkanalytics/sdk"]' package.json)
          sdk_version="${sdk_range#^}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publishing @roarkanalytics/cli@$version against @roarkanalytics/sdk@$sdk_range"

          if [ "$sdk_range" = 'workspace:*' ]; then
            echo '::error::the workspace dependency was not rewritten; dist/package.json would be unpublishable'
            exit 1
          fi

          # A `workspace:*` that resolved to an unpublished SDK version installs
          # fine here and fails for the first customer who runs `npm i -g`.
          if ! npm view "@roarkanalytics/sdk@$sdk_version" version >/dev/null 2>&1; then
            echo "::error::@roarkanalytics/sdk@$sdk_version is not on npm, so this CLI would not install"
            exit 1
          fi

          # npm rejects a duplicate version anyway; failing here says why.
          if npm view "@roarkanalytics/cli@$version" version >/dev/null 2>&1; then
            echo "::error::@roarkanalytics/cli@$version is already published. Bump packages/cli/package.json first."
            exit 1
          fi

          # The shrinkwrap is what makes an install of this version reproducible.
          # A publish missing it still works, which is exactly why it needs
          # asserting: nothing downstream fails, installs just quietly go back to
          # floating on `^` ranges.
          #
          # `packages/cli/build` only warns when it cannot generate one, because
          # it runs inside the repo-wide root build and must not fail it. This is
          # the other half of that arrangement: warn there, refuse here. The SDK
          # check above runs first, so the commonest cause already has its own
          # message by the time this one can fire.
          if [ ! -f npm-shrinkwrap.json ]; then
            echo '::error::dist/npm-shrinkwrap.json is missing, so every install of this version would \
          re-resolve the dependency tree and two installs could differ. `packages/cli/build` generates it and \
          warns rather than fails when it cannot - check the build log for that warning, then rebuild.'
            exit 1
          fi

          # The shrinkwrap and the manifest are generated by separate steps, so
          # they can disagree - and `npm ci`, which is what install.sh runs when
          # a shrinkwrap is present, hard-fails on exactly that. Catching it here
          # costs a line; catching it after an immutable publish costs a release.
          locked_sdk=$(jq -r -e '.packages["node_modules/@roarkanalytics/sdk"].version' npm-shrinkwrap.json)
          if [ "$locked_sdk" != "$sdk_version" ]; then
            echo "::error::the shrinkwrap pins @roarkanalytics/sdk@$locked_sdk but dist/package.json declares \
          $sdk_range. The build generated them out of step; rebuild before publishing."
            exit 1
          fi

          # The per-package hashes are the point of shipping the lockfile at all:
          # they extend the integrity check past the entry tarball to the whole
          # tree. An entry without one is a hole in that, so refuse to publish it.
          unhashed=$(jq -r '[.packages | to_entries[] | select(.key != "" and (.value.integrity | not)) | .key] | join(", ")' npm-shrinkwrap.json)
          if [ -n "$unhashed" ]; then
            echo "::error::these shrinkwrap entries have no integrity hash: $unhashed"
            exit 1
          fi

          echo "shrinkwrap pins $(jq -r '[.packages | keys[] | select(. != "")] | length' npm-shrinkwrap.json) packages, all hashed"

      # The bin is the product. A tarball whose entry point does not start is
      # worth catching before it is immutable on the registry rather than after.
      #
      # `--version` is asserted against dist/package.json rather than merely
      # printed. It used to be printed, and 0.1.0 shipped reporting `2.31.0` - a
      # stale SDK version baked into `src/version.ts` before `sync-version.cjs`
      # kept it in step. The number was right there in the log and nothing
      # compared it to anything, so it published and is now immutable.
      #
      # `check-versions.cjs` cannot cover this: it exempts packages/cli on
      # purpose, because the CLI is deliberately off the release train and
      # asserting it matches the SDK manifest would assert something we do not
      # want to be true. That exemption is exactly why the check belongs here,
      # against this package's own version, at the last moment it is still
      # cheap to be wrong.
      - name: Smoke test the built binary
        working-directory: packages/cli/dist
        run: |
          set -euo pipefail
          expected=$(jq -r -e '.version' package.json)
          reported=$(node bin.js --version)
          if [ "$reported" != "$expected" ]; then
            echo "::error::the binary reports $reported but this package is $expected. \
          src/version.ts is generated by scripts/sync-version.cjs from packages/cli/package.json; \
          a mismatch means the build did not run it. Publishing would ship a CLI that lies about \
          its own version, and npm publishes are immutable."
            exit 1
          fi
          echo "--version reports $reported, matching package.json"
          node bin.js --help > /dev/null

          # Existing on disk is not the same as shipping. npm silently drops some
          # files when it packs - a `package-lock.json` is dropped unconditionally,
          # which is the entire reason this is a shrinkwrap - so assert against the
          # tarball npm actually builds rather than against the directory.
          npm pack --loglevel=error >/dev/null
          tarball=$(ls -- *.tgz)
          # Listed once into a file, and grepped from the file rather than from a
          # pipe. `tar -tzf | grep -q` looks equivalent and is not: `grep -q`
          # exits at the first match, which closes the pipe, and GNU tar is still
          # writing - it dies with `tar: stdout: write error` and a non-zero
          # status. Under the `set -o pipefail` at the top of this step that
          # status becomes the pipeline's, so the test reports the entry as
          # MISSING precisely when it is PRESENT. The 0.2.0 dry run failed that
          # way on `package/npm-shrinkwrap.json`, which was in the tarball all
          # along. It is a race, so it does not reproduce on every tar or every
          # tarball size - macOS bsdtar exits 0 on the same input.
          entries="$RUNNER_TEMP/cli-tarball-entries.txt"
          tar -tzf "$tarball" > "$entries"
          # `entry`, not `path`: this step runs under bash, but the snippet gets
          # pasted into a terminal to debug it, and in zsh `path` is tied to PATH.
          for entry in package/npm-shrinkwrap.json package/man/roark.1 package/bin.js; do
            if ! grep -qxF "$entry" "$entries"; then
              echo "::error::$entry is missing from the tarball npm packed"
              exit 1
            fi
          done
          rm -f "$tarball"
          echo "the packed tarball carries the shrinkwrap, the man pages and the bin"

      - name: Publish
        if: inputs.dry_run != true
        working-directory: packages/cli/dist
        run: npm publish --access public --tag '${{ inputs.tag }}'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ROARK_NPM_TOKEN || secrets.NPM_TOKEN }}

      - name: Rehearse the publish
        if: inputs.dry_run == true
        working-directory: packages/cli/dist
        run: npm publish --access public --tag '${{ inputs.tag }}' --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ROARK_NPM_TOKEN || secrets.NPM_TOKEN }}

      - name: Summary
        if: always()
        run: |
          {
            echo '### @roarkanalytics/cli ${{ steps.check.outputs.version }}'
            if [ '${{ inputs.dry_run }}' = 'true' ]; then
              echo 'Dry run: built, checked and packed. Nothing was published.'
            else
              echo 'Published to npm under the `${{ inputs.tag }}` tag.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
