# Opens (and, once enabled, auto-merges) the PR that folds the SDK release train
# `next` into `main`, so release-please can cut a release from `main`.
#
# Why this is needed: codegen opens its PRs against `next`; release-please
# releases from `main` and googleapis/release-please-action@v4 has no
# `changes-branch`, so it only sees what has reached `main`. Nothing carried
# `next` onto `main`, so that fold was a manual PR every cycle. This automates
# opening it.
#
# Trigger: this fires on `workflow_run` when the `CI` workflow finishes on
# `next` (i.e. after a codegen push lands there). It CANNOT use `on: push:
# [next]`: a push-triggered workflow runs the copy of the file on the PUSHED
# branch, and this workflow lives only on `main` (the train folds `next` into
# `main` and never back, so `next` never receives main-only files). A
# `workflow_run` trigger, by contrast, always runs the file from the
# repository's DEFAULT branch (`main`), so it fires correctly even though the
# file is absent from `next`. That mismatch is what stalled the train silently:
# the push trigger never matched, so no fold PR opened and no release was cut,
# and since the workflow never started, its failure-only Slack alert never ran.
#
# Inert until the `FOLD_ENABLED` repository variable is 'true': the whole job is
# gated, so merging this workflow changes nothing until the variable is flipped.
name: fold-next-into-main

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [next]
  workflow_dispatch:

concurrency:
  group: fold-next-into-main
  cancel-in-progress: false

jobs:
  fold:
    # On workflow_run, only fold when CI actually passed on `next`; a manual
    # workflow_dispatch has no workflow_run context, so allow it unconditionally.
    if: >-
      vars.FOLD_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Mint a short-lived token from the org-owned release App. App-token PRs, like
      # PAT PRs and unlike GITHUB_TOKEN, DO trigger `on: pull_request` workflows, so
      # CI runs on the fold PR and auto-merge has checks to wait on.
      - name: Mint a token from the release App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Open or update the next -> main fold PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          # Nothing to fold if main already contains next.
          if git merge-base --is-ancestor origin/next origin/main; then
            echo 'main already contains next; nothing to fold.'
            exit 0
          fi

          number=$(gh pr list --base main --head next --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            url=$(gh pr create --base main --head next \
              --title 'chore: fold next into main' \
              --body 'Automated fold of the SDK release train (`next`) into `main` so release-please can cut a release. Opened by `fold-next-into-main.yml`.')
            number=$(printf '%s' "$url" | grep -oE '[0-9]+$')
            echo "Opened fold PR #$number."
          else
            echo "Fold PR #$number is already open; it tracks next automatically."
          fi

          # Enable native auto-merge so the fold lands once required checks pass.
          # A real merge commit, not a squash: release-please reads the individual
          # conventional commits on main, and squashing would collapse them into
          # one and lose per-change changelog entries. If auto-merge is disabled
          # for the repo this line is a no-op error and the PR simply waits for a
          # human - a safe degradation, not a failure.
          #
          # `--auto` waits for required checks, but when the PR is already CLEAN
          # (checks finished, nothing pending) GitHub refuses to *enable*
          # auto-merge and the call errors - which is how a fold PR silently sat
          # open. Fall back to an immediate `--merge`: it still respects branch
          # protection, so it only lands a PR that is genuinely mergeable now; if
          # checks are still pending it fails and the PR waits for a human.
          gh pr merge --auto --merge "$number" \
            || gh pr merge --merge "$number" \
            || echo 'Neither auto-merge nor an immediate merge was possible; leaving the fold PR for manual merge.'

      # A failed fold stalls the train: next never reaches main, so no release.
      # Alert #alarms-prod. No-op until SLACK_ALARMS_PROD_WEBHOOK_URL is set.
      - name: Slack notify - fold failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALARMS_PROD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "${SLACK_WEBHOOK_URL:-}" ] || { echo 'SLACK_ALARMS_PROD_WEBHOOK_URL unset; skipping'; exit 0; }
          text="🚨 next->main fold failed for \`@roarkanalytics/sdk\` - ${RUN_URL}"
          resp=$(curl -sS --max-time 15 -X POST -H 'Content-type: application/json' \
            --data "$(jq -n --arg t "$text" '{text:$t}')" "$SLACK_WEBHOOK_URL") \
            || { echo '::warning::Slack request failed (transport or timeout); alert not delivered'; exit 0; }
          # Best-effort, but not silent: a non-"ok" webhook response surfaces as a
          # warning rather than vanishing.
          [ "$resp" = ok ] || echo "::warning::Slack webhook did not accept the alert: $resp"

  # The fold above alerts when it fails. It cannot alert when it never runs: the
  # `if:` gate skips the whole job, and a skipped job runs no steps, so
  # `failure()` is never evaluated.
  #
  # That is not hypothetical. The Python SDK, which runs this same workflow, went
  # red on `next` on 2026-09-04; the gate skipped its fold on all eight pushes
  # that followed, `main` sat unchanged for five days with no release cut, and
  # nothing paged. It was noticed only because PyPI looked stale next to npm.
  # This repository has the same gap and has simply been lucky enough to keep CI
  # green.
  #
  # A job that is skipped cannot report on itself, so this is a separate job with
  # the opposite gate. It is the same silent-stall failure mode the header
  # describes, arriving through a different door: there, the trigger never
  # matched; here, the gate never opened.
  stalled:
    if: >-
      vars.FOLD_ENABLED == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Red CI on `next` only matters when `next` is ahead: right after a fold
      # lands there is nothing to strand, and alerting then would train everyone
      # to ignore this. Counting the stranded commits also makes the alert say
      # how long it has been going on without anyone having to open the repo.
      - name: Count what the skipped fold stranded
        id: stranded
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor origin/next origin/main; then
            echo 'main already contains next; a red CI on next strands nothing.'
            echo 'count=0' >> "$GITHUB_OUTPUT"
          else
            count=$(git rev-list --count origin/main..origin/next)
            echo "$count commit(s) stranded on next."
            echo "count=$count" >> "$GITHUB_OUTPUT"
          fi

      # Alert #alarms-prod. No-op until SLACK_ALARMS_PROD_WEBHOOK_URL is set,
      # matching the fold job's alert.
      - name: Slack notify - train stalled
        if: steps.stranded.outputs.count != '0'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALARMS_PROD_WEBHOOK_URL }}
          CI_URL: ${{ github.event.workflow_run.html_url }}
          COUNT: ${{ steps.stranded.outputs.count }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          [ -n "${SLACK_WEBHOOK_URL:-}" ] || { echo 'SLACK_ALARMS_PROD_WEBHOOK_URL unset; skipping'; exit 0; }
          # Names the consequence, not just the red check: "CI failed" reads as
          # routine, "no release is being cut" is the thing worth interrupting for.
          text="🚨 SDK release train stalled for \`@roarkanalytics/sdk\`: CI ${CONCLUSION} on \`next\`, so the next->main fold was skipped and no release can be cut. ${COUNT} commit(s) stranded. ${CI_URL}"
          resp=$(curl -sS --max-time 15 -X POST -H 'Content-type: application/json' \
            --data "$(jq -n --arg t "$text" '{text:$t}')" "$SLACK_WEBHOOK_URL") \
            || { echo '::warning::Slack request failed (transport or timeout); alert not delivered'; exit 0; }
          [ "$resp" = ok ] || echo "::warning::Slack webhook did not accept the alert: $resp"
