# This workflow is triggered when a GitHub release is created.
# It can also be run manually to re-publish to NPM in case it failed for some reason.
# You can run this workflow by navigating to https://www.github.com/roarkhq/sdk-roark-analytics-node/actions/workflows/publish-npm.yml
name: Publish NPM
on:
  workflow_dispatch:
    inputs:
      path:
        description: The path to run the release in. There is only one package here now, so '.'
        required: true

  release:
    types: [published]

env:
  # #alarms-prod, defined once here rather than repeated in every alert step.
  SLACK_ALARMS_CHANNEL: 'C064B836PL2'

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Install dependencies
        run: |
          pnpm install

      # Only `@roarkanalytics/sdk`. This used to publish `packages/mcp-server`
      # in the same run and attach its `.mcpb` bundle to the release; the MCP
      # server ships from roarkhq/mcp-roark-analytics now, on its own version
      # line, from a workflow a human dispatches. Leaving the path here would
      # fail every release on a directory that is not there.
      - name: Publish to NPM
        run: |
          if [ -n "$INPUT_PATH" ]; then
            PATHS_RELEASED="[\"$INPUT_PATH\"]"
          else
            PATHS_RELEASED='[\".\"]'
          fi
          pnpm tsn scripts/publish-packages.ts "{ \"paths_released\": \"$PATHS_RELEASED\" }"
        env:
          INPUT_PATH: ${{ github.event.inputs.path }}
          NPM_TOKEN: ${{ secrets.ROARK_NPM_TOKEN || secrets.NPM_TOKEN }}

      # Post the outcome to #alarms-prod. No-op until the SLACK_BOT_TOKEN org
      # secret is set; jq builds the payload so message text cannot break it.
      - name: Slack notify - published
        if: success()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          [ -n "${SLACK_BOT_TOKEN:-}" ] || { echo 'SLACK_BOT_TOKEN unset; skipping'; exit 0; }
          text="📦 \`@roarkanalytics/sdk\` ${VERSION:-(new version)} published to npm"
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-type: application/json; charset=utf-8' \
            --data "$(jq -n --arg t "$text" --arg c "$SLACK_ALARMS_CHANNEL" '{channel:$c,text:$t}')" >/dev/null || true

      - name: Slack notify - publish failed
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "${SLACK_BOT_TOKEN:-}" ] || { echo 'SLACK_BOT_TOKEN unset; skipping'; exit 0; }
          text="🚨 \`@roarkanalytics/sdk\` publish FAILED - ${RUN_URL}"
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-type: application/json; charset=utf-8' \
            --data "$(jq -n --arg t "$text" --arg c "$SLACK_ALARMS_CHANNEL" '{channel:$c,text:$t}')" >/dev/null || true
